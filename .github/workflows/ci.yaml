name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-patient:
    name: Build Patient Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: db
          POSTGRES_USER: admin_user
          POSTGRES_PASSWORD: password
        ports:
          - 5000:5432
        options: >-
          --health-cmd "pg_isready -U admin_user -d db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: patient-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: patient-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and Test
        working-directory: patient-service
        run: ./mvnw --batch-mode clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5000/db
          SPRING_DATASOURCE_USERNAME: admin_user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_SQL_INIT_MODE: always

  build-billing:
    name: Build Billing Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: billing-service/pom.xml

      - name: Build and Test
        working-directory: billing-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify